name: Release

on:
  push:
    branches: [master]
    paths: [VERSION]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release from master (for example v0.1.0 or v0.1.0-rc.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve and validate the release version
        id: target
        env:
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: python3 scripts/release_target.py >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    uses: ./.github/workflows/test.yml

  publish:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the release target
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/master
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          elif [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "The pushed release tag must already exist." >&2
            exit 1
          fi
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .draft")
          if [[ "$published" == false ]]; then
            echo "This version is already published. Create a new version instead of overwriting it." >&2
            exit 1
          fi
      - name: Create the annotated tag for a release from master
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_object=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$RELEASE_TAG" -f message="$RELEASE_TAG" \
              -f object="$(git rev-parse HEAD)" -f type=commit --jq .sha)
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$tag_object" --silent
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build archives and upload a draft release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
      - name: Attest the release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
      - name: Publish only after every archive and attestation succeeds
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --verify-tag --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --verify-tag
          fi

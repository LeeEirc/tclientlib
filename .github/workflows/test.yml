name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        go-version: ["1.20.x", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - run: go test -race -timeout=3m ./...
      - run: go vet ./...
      - name: Verify release version selection
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p 'test_release_target.py'
      - name: Verify interactive CLI with a real PTY and local TCP server
        if: runner.os == 'Linux'
        run: |
          go build -o "$RUNNER_TEMP/tclient" ./cmd/tclient
          python3 scripts/test_cli_pty.py "$RUNNER_TEMP/tclient"
      - run: cd _example/monitor && go test ./...

  release-snapshot:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Check release configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: check
      - name: Build release archives without publishing
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --snapshot --clean
      - name: Verify checksums and the Linux CLI archive
        shell: bash
        run: |
          (cd dist && sha256sum --check checksums.txt)
          mkdir -p "$RUNNER_TEMP/tclient-release-smoke"
          tar -xzf dist/tclient_*_linux_amd64.tar.gz -C "$RUNNER_TEMP/tclient-release-smoke"
          "$RUNNER_TEMP/tclient-release-smoke/tclient" --version
          "$RUNNER_TEMP/tclient-release-smoke/tclient" --help
      - name: Upload reviewable release archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tclient-snapshot-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

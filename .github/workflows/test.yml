name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        go-version: ["1.20.x", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: go test -race -timeout=3m ./...
      - run: go vet ./...
      - name: Verify interactive CLI with a real PTY and local TCP server
        if: runner.os == 'Linux'
        run: |
          go build -o "$RUNNER_TEMP/tclient" ./cmd/tclient
          python3 scripts/test_cli_pty.py "$RUNNER_TEMP/tclient"
      - run: cd _example/telnet_client && go test ./...
      - run: cd _example/monitor && go test ./...
